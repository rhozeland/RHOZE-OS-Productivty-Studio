        <h1>Rhozeland — get discovered, get supported, on-chain</h1>
        <p>Rhozeland is a discovery and support network for independent artists. Artists post work, prove ownership on-chain (Verified IP), build releases in public, and take support from fans through subscriptions, bookings, events, and creator coins.</p>
        <h2>What you can do here</h2>
        <ul>
          <li><strong>Discover artists</strong> — browse musicians, producers, engineers, visual artists, and promoters.</li>
          <li><strong>Follow releases in public</strong> — roadmaps, milestones, and progress updates on every release.</li>
          <li><strong>Support directly</strong> — subscribe, tip, book studio spaces, buy event tickets, or commission work.</li>
          <li><strong>Verified IP</strong> — every uploaded work is content-hashed and anchored on Solana.</li>
          <li><strong>Creator coins</strong> — artists link a pump.fun coin; Rhozeland surfaces live price, holders, and creator rewards.</li>
          <li><strong>Creator Pass</strong> — earn $RHOZE credits for real activity and unlock tier perks.</li>
        </ul>
