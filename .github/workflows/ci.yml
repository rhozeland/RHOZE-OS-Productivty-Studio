name: CI

on:
    push:
        branches: ["**"]
    pull_request:

# Cancel in-progress runs for the same branch when a new commit is pushed
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: "20"
    # Vite inlines VITE_* vars at build time. Dummy values are fine for a CI build;
    # swap for real secrets only if your build actually needs them.
    # VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}
    # VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

jobs:
    # ---------------------------------------------------------------------------
    # Stage 1: Build
    # Fails if dependencies, type checking, linting, or the Vite build break.
    # ---------------------------------------------------------------------------
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint --if-present

            - name: Build
              run: npm run build

            - name: Upload build output
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  retention-days: 7
                  if-no-files-found: error

    # ---------------------------------------------------------------------------
    # Stage 2: Test
    # Only runs if the build succeeded, so a red "Test" job means tests failed,
    # and a red "Build" job means the build failed.
    # ---------------------------------------------------------------------------
    test:
        name: Test
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # `--run` makes Vitest exit after one pass instead of watching.
            # If you use Jest, change this to: npm test -- --ci
            - name: Run tests
              run: npm test -- --run

    # ---------------------------------------------------------------------------
    # Optional Stage 3: Supabase checks (uncomment to enable)
    # Spins up a local Supabase stack, applies all migrations from scratch,
    # and lints the schema (catches broken migrations and bad RLS/SQL).
    # ---------------------------------------------------------------------------
